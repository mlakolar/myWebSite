bio: Sayantan Choudhury was a postdoctoral researcher at Mohamed bin Zayed University of Artificial
  Intelligence, hosted by Martin Takáč and Mladen Kolar. He received his PhD in Applied Mathematics and
  Statistics from Johns Hopkins University. His research is in machine learning and optimization,
  including large-scale and adaptive optimization, federated learning, and min-max problems.


