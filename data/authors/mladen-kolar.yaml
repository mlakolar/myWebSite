bio: Mladen Kolar is an Associate Professor of Econometrics and Statistics at the University of Chicago
  Booth School of Business. His research is focused on high-dimensional statistical methods, graphical
  models, varying-coefficient models and data mining, driven by the need to uncover interesting and scientifically
  meaningful structures from observational data.
