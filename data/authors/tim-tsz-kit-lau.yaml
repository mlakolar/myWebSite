bio: Tim Tsz-Kit Lau was a postdoctoral principal researcher at the University of Chicago Booth School
  of Business. He received his PhD in Statistics and Data Science from Northwestern University. His
  research lies at the intersection of statistics, machine learning and optimization, including
  optimizer design, batch size strategies and distributed stochastic optimization for large models.


